name: Image compression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/image-compression.test.js tests/compressed-render.test.js
