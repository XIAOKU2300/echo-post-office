name: Companion checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  companions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/companions.test.js tests/panel-ui.test.js tests/companion-integration.test.js
