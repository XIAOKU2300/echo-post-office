name: Update command checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  update-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/update-command.test.js tests/updater.test.js
